<!DOCTYPE html>

<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="IT2.css" />
    <!--Einbettung der p5.js-Bibliotheken-->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>  
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script> 
    <title>IT2-Projekt: Ghost-Runner</title>
</head>
<body>
    <header>
        <h1>Ghost Runner</h1>
        <p>Hier wird Audio sichtbar gemacht. <br /> Der Geist bewegt und verändert sich, je nachdem wie sich die Musik verändert.</p>
    </header>

   
    <main>
        
        <div id="game-wrapper">

            <!--Hier wird das JavaScript das Canvas vom p5.js einfügen-->
            <div id="canvas-container"></div> 

            <!--Enthält die Benutzeroberfläche-->
            <div id="ui-container">
                <!--Befehl für die Schieberegler-->
                <div class="control-group"> 
                    <label for="smoothing">Audio-Glättung: <span id="smooth-val">0.2</span></label> 
                    <input type="range" id="smoothing" min="0.01" max="0.99" value="0.2" step="0.01" oninput="document.getElementById('smooth-val').innerText=this.value"> 
                </div>
                <div class="control-group"> 
                    <label for="sensitivity">FFT-Empfindlichkeit: <span id="sens-val">15</span></label> 
                    <input type="range" id="sensitivity" min="1" max="30" value="15" step="0.5" oninput="document.getElementById('sens-val').innerText=this.value"> 
                </div>
            </div>


        </div>
    </main>
    <footer>
        <div class="footer-content">
            Ayla Emma Askin, Carina Kleine und Kim Schüttenberg <br />
            Jade Hochschule Wilhelmshaven 
            <br />Medienwirtschaft und Journalismus: Internettechnologien 2 
            <br />Sommersemester 2026
        </div>
    </footer>
            <!--Hier wird dann das Java-Script (sketch.js)geladen.-->
            <script src="sketch.js"></script> 
</body>
</html>
